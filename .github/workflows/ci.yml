name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportpilot -d supportpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://supportpilot:supportpilot@localhost:5432/supportpilot
      - run: npm test
        env:
          DATABASE_URL: postgresql://supportpilot:supportpilot@localhost:5432/supportpilot
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
